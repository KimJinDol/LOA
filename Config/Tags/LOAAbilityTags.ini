; LOAAbilityTags.ini
; Ability 태그. "이 Ability가 어떤 스킬인가"를 나타내는 이름표. Ability BP의 Asset Tags에서 고른다.
;
; [다른 태그와의 차이]
;   InputTag.Skill.Q              : 어느 키인가        (Ability Spec에 붙음. 슬롯을 옮기면 바뀜)
;   Ability.Berserker.Whirlwind   : 어떤 스킬인가      (Ability 자체에 붙음. 절대 안 바뀜)
;   Cooldown.Berserker.Whirlwind  : 지금 쿨타임 중인가 (쿨타임 동안 ASC에 붙음)
;
; [어디에 쓰나] (지금은 이름표만 달아 둔다)
;   - 스킬 슬롯 UI의 아이콘/이름 찾기
;   - "이 스킬만 취소/차단" 같은 지정 (CancelAbilitiesWithTag, BlockAbilitiesWithTag)
;   - 밸런스 DataTable의 행 키
;
; [이름 규칙] Ability.<주인>.<스킬 이름>
;   - 주인 = 직업 이름. 모든 직업이 같이 쓰는 것은 주인 없이 바로 이름(Dodge).
;   - 평타도 직업마다 모션/판정이 다르므로 직업 아래에 둔다.
;   - 쿨타임이 있는 스킬은 LOACooldownTags.ini에 같은 끝 이름으로 쿨타임 태그를 만든다.
;
; Config/Tags 폴더의 ini 파일은 엔진이 자동으로 읽는다. 추가 후 에디터 재시작.

