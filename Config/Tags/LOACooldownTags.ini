; LOACooldownTags.ini
; 쿨타임 태그. 쿨타임 GE가 붙어 있는 동안 ASC에 붙는다. Ability BP의 CooldownTags에서 고른다.
; C++ 코드는 이 태그들의 이름을 모른다. (GetCooldownTags()가 BP에서 고른 값을 돌려줄 뿐)
;
; [이름 규칙] Cooldown.<주인>.<스킬 이름>
;   - 주인 = 직업 이름(Berserker, Seres …). 모든 직업이 같이 쓰는 것은 Common (Cooldown.Common.Dodge).
;   - 스킬 이름은 Ability 태그(LOAAbilityTags.ini)의 끝부분과 똑같이 맞춘다.
;       Ability.Berserker.Whirlwind  ↔  Cooldown.Berserker.Whirlwind
;   - 숫자, 키 이름(Q, W …)은 쓰지 않는다.
;     쿨타임은 "키"가 아니라 "스킬"에 붙는다. 스킬을 Q에서 W로 옮겨도 이 태그는 그대로다.
;     (키는 Ability Spec의 InputTag가 담당)
;
; 평타처럼 쿨타임이 없는 스킬은 여기 넣지 않는다.

